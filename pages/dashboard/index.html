<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setu 管理面板</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/forms.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/nav.css">
</head>
<body>
  <div id="boot-mask">正在加载...</div>

  <!-- 移动端汉堡按钮 -->
  <button class="nav-hamburger" id="nav-hamburger" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>

  <!-- 移动端蒙层 -->
  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- 外层布局：导航侧边栏 + 主内容区 -->
  <div class="nav-layout">

    <!-- 左侧：固定导航侧边栏 -->
    <aside class="nav-sidebar" id="nav-sidebar">
      <div class="nav-brand">
        <h1 class="nav-title">Setu 管理</h1>
        <div class="nav-subtitle">会话配置 · 访问控制</div>
      </div>
      <nav class="nav-menu">
        <button class="nav-item active" data-tab="sessionConfig">
          <span class="nav-icon">📋</span>
          会话配置
        </button>
        <button class="nav-item" data-tab="accessControl">
          <span class="nav-icon">🛡️</span>
          访问控制
        </button>
      </nav>
    </aside>

    <!-- 右侧：主内容区 -->
    <main class="nav-main">

      <!-- ═══════ 标签页：会话配置 ═══════ -->
      <div class="tab-panel active" id="tab-sessionConfig">
        <div class="page-layout">
          <aside class="sidebar">
            <div class="section-header">
              <div>
                <h2 class="page-title">会话配置</h2>
                <div class="page-subtitle">按会话管理 Setu 的局部覆盖。</div>
              </div>
              <button class="btn btn-primary" id="btn-new">新建</button>
            </div>
            <div class="session-list" id="session-list"></div>
          </aside>

          <div class="sidebar-main">
            <section class="editor settings-shell">
              <div class="panel-section">
                <div class="section-header">
                  <h2>会话</h2>
                  <div class="actions">
                    <button class="btn btn-secondary" data-action="sc-reload">刷新</button>
                    <button class="btn btn-danger" data-action="sc-delete">删除</button>
                    <button class="btn btn-primary" data-action="sc-save">保存</button>
                  </div>
                </div>
                <div class="form-grid three">
                  <label>session_id
                    <input id="field-session-id" placeholder="aiocqhttp:GroupMessage:123456">
                  </label>
                  <label>session_type
                    <select id="field-session-type">
                      <option value="group">group</option>
                      <option value="private">private</option>
                    </select>
                  </label>
                  <label>display_name
                    <input id="field-display-name" placeholder="测试群">
                  </label>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-header">
                  <h2>配置覆盖</h2>
                  <button class="btn btn-secondary" data-action="sc-clear">清空覆盖</button>
                </div>
                <div class="keys" id="key-list"></div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <!-- ═══════ 标签页：访问控制 ═══════ -->
      <div class="tab-panel" id="tab-accessControl">
        <section class="container">
          <div class="dashboard-shell">
            <header class="dashboard-header">
              <div>
                <h1 class="page-title">访问控制</h1>
                <div class="page-subtitle">管理 Setu/运势的用户和群组黑白名单。</div>
              </div>
              <button class="btn btn-secondary" data-action="ac-reload">刷新</button>
            </header>

            <section class="stats-row">
              <label class="stat-card">Setu 用户
                <select id="mode-setu-user"></select>
              </label>
              <label class="stat-card">Setu 群组
                <select id="mode-setu-group"></select>
              </label>
              <label class="stat-card">运势用户
                <select id="mode-fortune-user"></select>
              </label>
              <label class="stat-card">运势群组
                <select id="mode-fortune-group"></select>
              </label>
            </section>

            <div class="section-header">
              <div class="hint">访问模式支持 none、blacklist、whitelist。</div>
              <button class="btn btn-primary" data-action="ac-save-modes">保存模式</button>
            </div>

            <div class="dashboard-content">
              <section class="panel-section settings-form">
                <div class="section-header">
                  <h2 id="form-title">新增记录</h2>
                  <button class="btn btn-secondary" data-action="ac-reset-form">清空</button>
                </div>
                <div class="form-grid">
                  <label>功能
                    <select id="field-feature">
                      <option value="setu">Setu</option>
                      <option value="fortune">运势</option>
                    </select>
                  </label>
                  <label>对象
                    <select id="field-subject-type">
                      <option value="user">用户</option>
                      <option value="group">群组</option>
                    </select>
                  </label>
                  <label>名单
                    <select id="field-list-type">
                      <option value="blacklist">黑名单</option>
                      <option value="whitelist">白名单</option>
                    </select>
                  </label>
                  <label>ID
                    <input id="field-target-id" placeholder="用户 ID 或群组 ID">
                  </label>
                </div>
                <div class="form-grid two-one">
                  <label>备注
                    <input id="field-note" placeholder="可选">
                  </label>
                  <div class="actions">
                    <button class="btn btn-primary" data-action="ac-save-entry">保存记录</button>
                  </div>
                </div>
              </section>

              <section class="table-section">
                <div class="section-header">
                  <h2>记录</h2>
                  <div class="action-bar">
                    <input class="search-input" id="filter-search" placeholder="搜索 ID 或备注">
                    <select class="select-input" id="filter-feature">
                      <option value="">全部功能</option>
                      <option value="setu">Setu</option>
                      <option value="fortune">运势</option>
                    </select>
                    <select class="select-input" id="filter-subject-type">
                      <option value="">全部对象</option>
                      <option value="user">用户</option>
                      <option value="group">群组</option>
                    </select>
                    <select class="select-input" id="filter-list-type">
                      <option value="">全部名单</option>
                      <option value="blacklist">黑名单</option>
                      <option value="whitelist">白名单</option>
                    </select>
                  </div>
                </div>
                <div class="table-scroll-area">
                  <table class="sub-table">
                    <thead>
                      <tr>
                        <th>功能</th>
                        <th>对象</th>
                        <th>名单</th>
                        <th>ID</th>
                        <th>备注</th>
                        <th class="col-actions">操作</th>
                      </tr>
                    </thead>
                    <tbody id="entry-list"></tbody>
                  </table>
                </div>
                <div class="empty-state" id="empty-state" style="display:none;">暂无匹配记录</div>
              </section>
            </div>
          </div>
        </section>
      </div>

    </main>
  </div>

  <div class="toast" id="toast" style="display:none;"></div>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
